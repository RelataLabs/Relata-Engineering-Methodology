name: REM doctor

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1"

permissions:
  contents: read

jobs:
  rem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Validate REM invariants
        run: node scripts/rem-doctor.mjs
      - name: Flow summary
        if: always()
        run: node scripts/rem-flow.mjs
